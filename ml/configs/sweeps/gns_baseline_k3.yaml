model:
  name: gns_baseline
  latent: 128
  n_mp_steps: 10
  mlp_depth: 2
  aggregation: sum
  node_type_embed_dim: 16
  edge_sets: [material, interaction]
data:
  data_dir: /data/processed/5c60fa669a719404
  splits: /data/processed/5c60fa669a719404/splits/splits.json
  C: 5
  node_features: [v_hist, u, u_next, charge]
  globals_fields: [qE, m, N]
  edge_sets: [material, interaction]
  radius: 0.05
  noise_k: 3.0
  normalize_features: true
  rotate_augment: false
  sample_weight: per_run
  cache_shards: 8
train:
  seed: 42
  seeds: [42]
  optimizer: adam
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 0.0
  max_steps: 500000
  grad_clip: 1.0
  log_every: 10
  lr_schedule: {type: exponential, lr_end: 1.0e-6}
  val_every: 1000
  rollout_K: 20
  early_stopping: {metric: val_rollout_mse, patience: 50}
  num_workers: 4
  checkpoint_dir: Tema 1/results/ml/runs
wandb:
  project: poliphysics-ballooning-ml
  mode: online
  entity: null
eval:
  rollout_K: 100
  t_end: 60.0
