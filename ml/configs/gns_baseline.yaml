# Full MeshGraphNet / GNS baseline (Sanchez-Gonzalez 2020 + Pfaff 2021).
# Local smoke default: local_subset (must include stored u_next from 5c60fa…).
# GPU full train: override data_dir to the synced 5c60fa669a719404 pack.
model:
  name: gns_baseline
  latent: 128
  n_mp_steps: 10
  mlp_depth: 2
  aggregation: sum
  node_type_embed_dim: 16
  edge_sets: [material, interaction]

data:
  data_dir: Tema 1/results/ml/processed/local_subset
  splits: Tema 1/results/ml/splits/splits.json
  C: 5
  node_features: [v_hist, u, u_next, charge]
  globals_fields: [qE, m, N]   # sigma_w, ell, spider_z off by default
  edge_sets: [material, interaction]
  radius: 0.05                 # cross-thread neighbourhood near the spider
  # noise_std = noise_k * std(dv); dv = a*dt from train-only stats (see noise_stats.json)
  noise_k: 1.0
  normalize_features: true
  rotate_augment: false        # yaw augmentation OFF for baseline
  sample_weight: per_run
  cache_shards: 4
  mmap: true
  shard_aware: true

train:
  seed: 42
  seeds: [42]
  optimizer: adam
  batch_size: 2                # smoke / MPS; L4: raise (try 8–16)
  lr: 1.0e-4
  weight_decay: 0.0
  max_steps: 300               # smoke; GPU full train overrides (e.g. 500000)
  grad_clip: 1.0
  log_every: 10
  lr_schedule:
    type: exponential
    lr_end: 1.0e-6
  val_every: 50
  rollout_K: 20                # short open-loop position MSE (m²); see train.rollout_mse
  early_stopping:
    metric: val_rollout_mse
    patience: 20
  num_workers: 0
  prefetch_factor: 2
  checkpoint_dir: Tema 1/results/ml/runs

wandb:
  project: poliphysics-ballooning-ml
  mode: offline
  entity: null

eval:
  rollout_K: 20
  t_end: 5.0                   # smoke; full eval uses 60.0
  max_full_runs: 3
