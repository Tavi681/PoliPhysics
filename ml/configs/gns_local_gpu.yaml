# Full-train material-only GNS on L4 (data version 5c60fa669a719404). k=1.
model:
  name: gns_local
  latent: 128
  n_mp_steps: 10
  mlp_depth: 2
  aggregation: sum
  node_type_embed_dim: 16
  edge_sets: [material]

data:
  data_dir: /data/processed/5c60fa669a719404
  splits: /data/processed/5c60fa669a719404/splits/splits.json
  C: 5
  node_features: [v_hist, u, charge]
  globals_fields: [qE, m, N]
  edge_sets: [material]
  radius: 0.05
  noise_k: 1.0
  normalize_features: true
  rotate_augment: false
  sample_weight: per_run
  # mmap + lazy expand: small LRU of raw blobs; OS page cache is the real cache.
  # Was 16 — with full-shard expand × 6 workers that blew 32 GB and stalled index build.
  cache_shards: 2
  mmap: true
  shard_aware: true

train:
  seed: 42
  seeds: [42]
  optimizer: adam
  batch_size: 16            # batch_sweep may raise; keep lr=1e-4 + exponential decay
  lr: 1.0e-4
  weight_decay: 0.0
  max_steps: 500000
  grad_clip: 1.0
  log_every: 10
  lr_schedule:
    type: exponential
    lr_end: 1.0e-6
  val_every: 1000
  rollout_K: 20
  early_stopping:
    metric: val_rollout_mse
    patience: 50
  num_workers: 4            # was 6; leave RAM margin on g2-standard-8 (32 GB)
  prefetch_factor: 2
  checkpoint_dir: Tema 1/results/ml/runs

wandb:
  project: poliphysics-ballooning-ml
  mode: online
  entity: null

eval:
  rollout_K: 100
  t_end: 60.0
