# Full-train material-only GNS on L4 (data version 5c60fa669a719404). k=1.
model:
  name: gns_local
  latent: 128
  n_mp_steps: 10
  mlp_depth: 2
  aggregation: sum
  node_type_embed_dim: 16
  edge_sets: [material]

data:
  data_dir: /data/processed/5c60fa669a719404
  splits: /data/processed/5c60fa669a719404/splits/splits.json
  C: 5
  node_features: [v_hist, u, charge]
  globals_fields: [qE, m, N]
  edge_sets: [material]
  radius: 0.05
  noise_k: 1.0
  normalize_features: true
  rotate_augment: false
  sample_weight: per_run
  cache_shards: 2
  mmap: true
  shard_aware: true

train:
  seed: 42
  seeds: [42]
  optimizer: adam
  batch_size: 128
  lr: 1.0e-4
  weight_decay: 0.0
  max_epochs: 15                  # over ~4.24M train frames
  # max_steps derived as max_epochs * ceil(n_train / batch_size)
  grad_clip: 1.0
  log_every: 10
  lr_schedule:
    type: exponential
    lr_end: 1.0e-6                # decay over max_epochs * steps_per_epoch
  val_every: 1000
  val_one_step_frames: 256
  val_rollout_runs: 32
  val_rollout_every: null         # auto ≤10% wall
  rollout_K: 20
  early_stopping:
    metric: val_rollout_mse
    patience_epochs: 2
  cost_cap_usd: 40.0
  vm_usd_per_hour: 0.853624312    # g2-standard-8 + L4 us-central1 on-demand
  num_workers: 4
  prefetch_factor: 2
  checkpoint_dir: Tema 1/results/ml/runs

wandb:
  project: poliphysics-ballooning-ml
  mode: online
  entity: null

eval:
  rollout_K: 100
  t_end: 60.0
