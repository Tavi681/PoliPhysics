model:
  name: constant_velocity

data:
  data_dir: Tema 1/results/ml/processed/local_subset
  splits: Tema 1/results/ml/splits/splits.json
  C: 5
  node_features: [v_hist, u, charge, node_type]
  edge_sets: [material]
  sample_weight: per_run

train:
  seed: 42
  seeds: [42]
  batch_size: 4
  max_steps: 0  # no training
  checkpoint_dir: Tema 1/results/ml/runs

wandb:
  project: poliphysics-ballooning-ml
  mode: disabled

eval:
  seed: 42
  one_step_n_frames: 100
  rollout_K: 20
  t_end: 5.0
  max_full_runs: 2
  horizon_errors_s: [0.2, 1.0, 5.0]
  stream_full_rollouts: true
  error_vs_time_grid_s: [0.2, 0.5, 1.0, 2.0, 5.0]
  full_rollout_batch_runs: 1
