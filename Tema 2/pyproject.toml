[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netsim"
version = "0.1.0"
description = "Explicit mass-spring simulator for drone impact on a prestressed planar net with thread failure (Algorithm 1)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
numba = [
    "numba>=0.58",
]
test = [
    "pytest>=7.0",
    "matplotlib>=3.7",
]

[project.scripts]
netsim = "netsim.cli:main"

[tool.setuptools.packages.find]
include = ["netsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
