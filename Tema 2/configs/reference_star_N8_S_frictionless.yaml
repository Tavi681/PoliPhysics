# Reference case, frictionless contact variant (star N=8, material S).
material:
  name: S

net:
  kind: star
  N: 8
  R: 1.0
  eps_p: 0.0
  A_hat: 1.0e-6

drone:
  M: 1.0
  r_d: 0.15          # TODO: fix before production runs
  v0: 15.0
  p: [0.5, 0.0]
  gravity: false

contact:
  mode: frictionless # frictionless | gripped
  k_c: 1.0e+7         # TODO: fix before production runs
  segment_contact: false
  delta_ref_frac: 0.01

numerics:
  n_s: 40
  C: 0.5
  t_end: 0.2
  dt_out: 1.0e-4
  damping: 0.0
  area_scale: 1.0
  use_numba: true

output:
  hdf5: null
  R_max: 0.5         # TODO: fix before production runs
  k_max: 10          # TODO: fix before production runs
