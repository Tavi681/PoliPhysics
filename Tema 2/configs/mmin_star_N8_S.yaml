# Algorithm 2 (minimum mass) example: star N=8, material S, gripped contact.
material:
  name: S

net:
  kind: star
  N: 8
  R: 1.0
  eps_p: 0.0
  A_hat: 1.0e-6

drone:
  M: 1.0
  r_d: 0.15          # TODO: fix before production runs
  v0: 15.0
  p: [0.0, 0.0]
  gravity: false

contact:
  mode: gripped
  k_c: 1.0e+7         # TODO: fix before production runs
  penetration_guard: reduce_dt
  delta_ref_frac: 0.01

numerics:
  n_s: 10
  C: 0.5
  t_end: 0.25
  dt_out: 5.0e-3
  use_numba: true

output:
  hdf5: null
  R_max: 0.5         # TODO: fix before production runs
  k_max: 10          # TODO: fix before production runs

# Algorithm 2 settings.
mmin:
  criterion: A           # A or B (override with --criterion)
  tol: 0.05
  s0_scale: 1.0
  n_procs: 4
  impact_points:
    - [0.0, 0.0]
    - [0.25, 0.0]
    - [0.5, 0.0]
    - [0.25, 0.25]
