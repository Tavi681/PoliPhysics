[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ballooning"
version = "0.1.0"
description = "Implicit Discrete Elastic Rods time stepping for multi-thread charged ballooning spiders (Algorithm 1)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "matplotlib>=3.7",
]

[project.scripts]
ballooning = "ballooning.cli:main"

[tool.setuptools.packages.find]
include = ["ballooning*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that run the time stepper (deselect with '-m \"not slow\"')",
]
